services:
  site:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PORT: "4000"
      FIREBASE_DATABASE_URL: "${FIREBASE_DATABASE_URL:?Preencha FIREBASE_DATABASE_URL no .env}"
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase.json
      KEY_ENCRYPTION_SECRET: "${KEY_ENCRYPTION_SECRET:?Preencha KEY_ENCRYPTION_SECRET no .env}"
    ports:
      - "127.0.0.1:${HOST_PORT:-4000}:4000"
    volumes:
      - type: bind
        source: "${FIREBASE_SERVICE_ACCOUNT_PATH:?Informe o caminho do JSON do Firebase no .env}"
        target: /run/secrets/firebase.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
