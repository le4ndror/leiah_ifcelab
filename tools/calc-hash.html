<!DOCTYPE html>
<html>
<head>
    <title>Calcular Hash</title>
</head>
<body>
<script>
async function calcularHash(valor) {
    const data = new TextEncoder().encode(valor);
    const buf = await crypto.subtle.digest('SHA-256', data);
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    document.body.textContent = 'Hash SHA-256: ' + hash;
}
const valor = prompt('Digite um valor para calcular o SHA-256:');
if (valor !== null) calcularHash(valor);
</script>
</body>
</html>
