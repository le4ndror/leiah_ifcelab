<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Institucional - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-professor.css">
</head>
<body>
    <div class="stray-spark" style="top: 20%; left: 15%;"></div>
    <div class="stray-spark" style="top: 60%; left: 75%; animation-delay: 3s;"></div>
    <div class="stray-spark" style="top: 80%; left: 30%; animation-delay: 6s;"></div>

    <div class="card">
        <div class="visual">
            <svg viewBox="0 0 400 500" fill="none">
                <defs>
                    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(57,227,122,0.15)" />
                        <stop offset="100%" stop-color="rgba(26,138,74,0.05)" />
                    </linearGradient>
                </defs>
                <rect width="400" height="500" fill="url(#glowGrad)" />
                
                <path class="trace dim" d="M50 450 L100 350 L150 380 L200 280 L250 320 L300 200 L350 250" />
                <path class="trace dim" d="M80 480 L120 400 L180 420 L240 350 L280 380 L320 300" />
                <path class="trace dim" d="M40 400 L90 320 L140 360 L190 250 L240 290 L290 180" />
                
                <path class="pulse" d="M50 450 L100 350 L150 380 L200 280 L250 320 L300 200 L350 250" />
                <path class="pulse p2" d="M80 480 L120 400 L180 420 L240 350 L280 380 L320 300" />
                <path class="pulse p3" d="M40 400 L90 320 L140 360 L190 250 L240 290 L290 180" />
                
                <circle class="node" cx="50" cy="450" r="4" />
                <circle class="node lit d1" cx="100" cy="350" r="4" />
                <circle class="node" cx="150" cy="380" r="4" />
                <circle class="node lit d2" cx="200" cy="280" r="4" />
                <circle class="node" cx="250" cy="320" r="4" />
                <circle class="node lit d3" cx="300" cy="200" r="4" />
                <circle class="node" cx="350" cy="250" r="4" />
                
                <rect class="chip" x="180" y="160" width="40" height="40" rx="4" />
                <rect class="chip" x="100" y="340" width="30" height="30" rx="3" />
                <rect class="chip" x="280" y="190" width="35" height="35" rx="3" />
            </svg>
            
            <div class="visual-content">
                <div class="visual-eyebrow">
                    <div class="dot"></div>
                    <span>Sistema Ativo</span>
                </div>
                <h2 class="visual-title">Portal do Professor</h2>
                <p class="visual-sub">Acesso seguro ao sistema de gerenciamento de laboratório e avaliações em tempo real.</p>
            </div>
            
            <div class="voltage-badge">5.0V ACTIVE</div>
        </div>
        
        <div class="panel">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                </div>
                <span class="brand-name">IFCE LAB</span>
            </div>
            
            <h1 class="title">Acesso Institucional</h1>
            <p class="subtitle">Entre com suas credenciais para acessar o painel de gerenciamento.</p>
            
            <form onsubmit="entrarProfessor(event)">
                <div class="field">
                    <label for="senhaProfessor">Senha de Acesso</label>
                    <div class="input-wrap">
                        <input type="password" id="senhaProfessor" placeholder="Digite sua senha" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Autenticar</button>
                <button type="button" class="btn-back" onclick="window.location.href='index.html'">Voltar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
