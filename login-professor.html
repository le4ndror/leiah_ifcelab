<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Professor - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="system-active">
<div class="container">
    <div class="card">
        <button id="btnVoltarTopo" class="btn-voltar-topo" onclick="window.location.href='index.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar
        </button>
        <div id="loginProfessor" class="tela login-screen ativa">
            <div class="login-background">
                <div class="circuit-mesh"></div>
                <div class="radial-glow"></div>
                <div class="scan-line"></div>
                <div class="corner-bracket corner-tl"></div>
                <div class="corner-bracket corner-tr"></div>
                <div class="corner-bracket corner-bl"></div>
                <div class="corner-bracket corner-br"></div>
            </div>
            <div class="login-glass-panel">
                <button onclick="window.location.href='index.html'" class="login-back-link">Voltar</button>
                <form class="login-form">
                    <input type="password" id="senhaProfessor" placeholder="Senha de acesso" class="login-input">
                    <button type="button" onclick="entrarProfessor()" class="login-btn-primary">Autenticar</button>
                    <button type="button" onclick="window.location.href='index.html'" class="login-btn-secondary">Voltar</button>
                </form>
                <div class="login-status-strip">
                    <div class="status-dot"></div>
                    <span class="status-text">TLS 1.3 · CIFRADO · ISOLADO</span>
                    <div class="status-dot"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
