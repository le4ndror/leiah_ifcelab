<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Institucional - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-professor.css">
</head>
<body>
    <div class="stray-spark" style="top: 20%; left: 15%;"></div>
    <div class="stray-spark" style="top: 60%; left: 75%; animation-delay: 3s;"></div>
    <div class="stray-spark" style="top: 80%; left: 30%; animation-delay: 6s;"></div>

    <div class="card">
        <div class="visual">
            <div class="visual-content">
                <div class="visual-eyebrow">
                    <div class="dot"></div>
                    <span>Sistema Ativo</span>
                </div>
                <h2 class="visual-title">Portal do Professor</h2>
                <p class="visual-sub">Acesso seguro ao sistema de gerenciamento de laboratório e avaliações em tempo real.</p>
            </div>
            
            <div class="voltage-badge">5.0V ACTIVE</div>
        </div>
        
        <div class="panel">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                </div>
                <span class="brand-name">IFCE LAB</span>
            </div>
            
            <h1 class="title">Acesso Institucional</h1>
            <p class="subtitle">Entre com suas credenciais para acessar o painel de gerenciamento.</p>
            
            <form onsubmit="entrarProfessor(event)">
                <div class="field">
                    <label for="senhaProfessor">Senha de Acesso</label>
                    <div class="input-wrap">
                        <input type="password" id="senhaProfessor" placeholder="Digite sua senha" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Autenticar</button>
                <button type="button" class="btn-back" onclick="window.location.href='index.html'">Voltar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
