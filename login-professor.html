<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Institucional - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #07090a;
            --panel-black: #0e1210;
            --panel-black-2: #121712;
            --line: #1e2620;
            --green-deep: #0e3d22;
            --green: #1a8a4a;
            --green-bright: #39e37a;
            --green-glow: #7dffb0;
            --text-main: #eaf3ee;
            --text-mute: #7c9184;
            --danger: #ff5c5c;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg-void);
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 42px 42px;
            opacity: .25;
            mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 75%);
            pointer-events: none;
        }

        .stray-spark {
            position: fixed;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--green-bright);
            box-shadow: 0 0 8px 2px var(--green-bright);
            animation: drift 9s linear infinite;
            opacity: .7;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: .8; }
            90% { opacity: .8; }
            100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
        }

        .card {
            position: relative;
            width: min(960px, 100%);
            min-height: 560px;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            background: var(--panel-black);
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(57, 227, 122, .04),
                0 30px 80px -20px rgba(0, 0, 0, .8),
                0 0 120px -40px rgba(26, 138, 74, .35);
        }

        .visual {
            position: relative;
            background:
                radial-gradient(circle at 25% 20%, rgba(26, 138, 74, .35), transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(57, 227, 122, .18), transparent 50%),
                linear-gradient(160deg, #0a0f0c 0%, #060907 100%);
            display: flex;
            align-items: flex-end;
            padding: 36px;
            overflow: hidden;
        }

        .visual svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .trace {
            fill: none;
            stroke: var(--green);
            stroke-width: 1.4;
            opacity: .55;
        }

        .trace.dim { stroke: #1c3d29; opacity: .4; }

        .pulse {
            fill: none;
            stroke: var(--green-glow);
            stroke-width: 2.2;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px var(--green-bright));
            stroke-dasharray: 14 800;
            animation: flow 4.5s linear infinite;
        }
        .pulse.p2 { animation-duration: 6s; animation-delay: 1.1s; }
        .pulse.p3 { animation-duration: 5.2s; animation-delay: 2.3s; }
        .pulse.p4 { animation-duration: 7s; animation-delay: .6s; }

        @keyframes flow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -820; }
        }

        .node {
            fill: var(--panel-black);
            stroke: var(--green);
            stroke-width: 1.4;
        }
        .node.lit {
            fill: var(--green-bright);
            stroke: var(--green-glow);
            filter: drop-shadow(0 0 6px var(--green-bright));
            animation: blink 2.6s ease-in-out infinite;
        }
        .node.lit.d1 { animation-delay: .4s; }
        .node.lit.d2 { animation-delay: 1.2s; }
        .node.lit.d3 { animation-delay: 2s; }

        @keyframes blink {
            0%, 100% { opacity: .35; }
            50% { opacity: 1; }
        }

        .chip {
            fill: #0c130e;
            stroke: var(--line);
            stroke-width: 1;
        }

        .visual-content {
            position: relative;
            z-index: 2;
            color: var(--text-main);
        }

        .visual-eyebrow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--green-bright);
            margin-bottom: 14px;
        }

        .visual-eyebrow .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green-bright);
            box-shadow: 0 0 8px var(--green-bright);
            animation: blink 1.8s ease-in-out infinite;
        }

        .visual-title {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.25;
            margin: 0 0 10px;
            max-width: 320px;
        }

        .visual-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--text-mute);
            max-width: 300px;
            line-height: 1.6;
        }

        .voltage-badge {
            position: absolute;
            top: 28px;
            right: 28px;
            z-index: 2;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--green-bright);
            border: 1px solid rgba(57, 227, 122, .35);
            border-radius: 100px;
            padding: 6px 12px;
            background: rgba(10, 20, 14, .55);
            backdrop-filter: blur(6px);
            letter-spacing: .06em;
        }

        .panel {
            background: var(--panel-black-2);
            padding: 56px 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green-bright), transparent);
            opacity: .5;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 34px;
        }

        .brand-mark {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: linear-gradient(145deg, var(--green), var(--green-deep));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 18px -2px rgba(57, 227, 122, .55), inset 0 0 0 1px rgba(255, 255, 255, .08);
        }

        .brand-mark svg { width: 18px; height: 18px; }

        .brand-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--text-mute);
        }

        h1.title {
            font-size: 30px;
            font-weight: 700;
            margin: 0 0 8px;
            letter-spacing: -.01em;
        }

        .subtitle {
            color: var(--text-mute);
            font-size: 14px;
            margin: 0 0 34px;
            line-height: 1.5;
        }

        form { display: flex; flex-direction: column; gap: 18px; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text-mute);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap input {
            width: 100%;
            background: #0a0f0b;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 44px 14px 16px;
            font-size: 14.5px;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .input-wrap input::placeholder { color: #4d5c53; }

        .input-wrap input:focus {
            border-color: var(--green);
            background: #0c130e;
            box-shadow: 0 0 0 3px rgba(26, 138, 74, .22), 0 0 18px -4px rgba(57, 227, 122, .4);
        }

        .input-wrap input:focus-visible {
            outline: 2px solid var(--green-bright);
            outline-offset: 2px;
        }

        .btn-submit {
            margin-top: 12px;
            background: linear-gradient(145deg, var(--green), var(--green-deep));
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all .18s ease;
            box-shadow: 0 0 18px -2px rgba(57, 227, 122, .55);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 24px -2px rgba(57, 227, 122, .7);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-back {
            margin-top: 16px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            color: var(--text-mute);
            cursor: pointer;
            transition: all .18s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        .btn-back:hover {
            border-color: var(--green);
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .card {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            .visual {
                display: none;
            }
            .panel {
                padding: 40px 32px;
            }
        }
    </style>
</head>
<body>
    <div class="stray-spark" style="top: 20%; left: 15%;"></div>
    <div class="stray-spark" style="top: 60%; left: 75%; animation-delay: 3s;"></div>
    <div class="stray-spark" style="top: 80%; left: 30%; animation-delay: 6s;"></div>

    <div class="card">
        <div class="visual">
            <svg viewBox="0 0 400 500" fill="none">
                <defs>
                    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(57,227,122,0.15)" />
                        <stop offset="100%" stop-color="rgba(26,138,74,0.05)" />
                    </linearGradient>
                </defs>
                <rect width="400" height="500" fill="url(#glowGrad)" />
                
                <path class="trace dim" d="M50 450 L100 350 L150 380 L200 280 L250 320 L300 200 L350 250" />
                <path class="trace dim" d="M80 480 L120 400 L180 420 L240 350 L280 380 L320 300" />
                <path class="trace dim" d="M40 400 L90 320 L140 360 L190 250 L240 290 L290 180" />
                
                <path class="pulse" d="M50 450 L100 350 L150 380 L200 280 L250 320 L300 200 L350 250" />
                <path class="pulse p2" d="M80 480 L120 400 L180 420 L240 350 L280 380 L320 300" />
                <path class="pulse p3" d="M40 400 L90 320 L140 360 L190 250 L240 290 L290 180" />
                
                <circle class="node" cx="50" cy="450" r="4" />
                <circle class="node lit d1" cx="100" cy="350" r="4" />
                <circle class="node" cx="150" cy="380" r="4" />
                <circle class="node lit d2" cx="200" cy="280" r="4" />
                <circle class="node" cx="250" cy="320" r="4" />
                <circle class="node lit d3" cx="300" cy="200" r="4" />
                <circle class="node" cx="350" cy="250" r="4" />
                
                <rect class="chip" x="180" y="160" width="40" height="40" rx="4" />
                <rect class="chip" x="100" y="340" width="30" height="30" rx="3" />
                <rect class="chip" x="280" y="190" width="35" height="35" rx="3" />
            </svg>
            
            <div class="visual-content">
                <div class="visual-eyebrow">
                    <div class="dot"></div>
                    <span>Sistema Ativo</span>
                </div>
                <h2 class="visual-title">Portal do Professor</h2>
                <p class="visual-sub">Acesso seguro ao sistema de gerenciamento de laboratório e avaliações em tempo real.</p>
            </div>
            
            <div class="voltage-badge">5.0V ACTIVE</div>
        </div>
        
        <div class="panel">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                </div>
                <span class="brand-name">IFCE LAB</span>
            </div>
            
            <h1 class="title">Acesso Institucional</h1>
            <p class="subtitle">Entre com suas credenciais para acessar o painel de gerenciamento.</p>
            
            <form onsubmit="entrarProfessor(event)">
                <div class="field">
                    <label for="senhaProfessor">Senha de Acesso</label>
                    <div class="input-wrap">
                        <input type="password" id="senhaProfessor" placeholder="Digite sua senha" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Autenticar</button>
                <button type="button" class="btn-back" onclick="window.location.href='index.html'">Voltar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
