<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Professor - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #141414;
            --panel-black: #1f1f1f;
            --green: #16a34a;
            --green-dark: #15803d;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100vh;
            background: var(--bg-void);
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
        }

        body {
            overflow-y: auto;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 32px;
            padding: 16px 48px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
            transition: background 0.3s;
        }

        .header.scrolled {
            background: var(--bg-void);
        }

        .logo {
            color: var(--green);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            user-select: none;
        }

        .logo span {
            color: var(--text-main);
        }

        .nav {
            display: flex;
            gap: 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav a:hover, .nav a.active {
            color: var(--text-main);
            font-weight: 600;
        }

        .user-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            width: 100%;
            height: 82vh;
            min-height: 520px;
        }

        .hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
        }

        .hero-overlay-bottom {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-void) 0%, transparent 100%);
        }

        .hero-content {
            position: absolute;
            bottom: 96px;
            left: 48px;
            max-width: 512px;
        }

        .hero-subtitle {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--green);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .hero-description {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-secondary {
            background: rgba(107, 114, 128, 0.7);
            color: var(--text-main);
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: rgba(107, 114, 128, 0.5);
        }

        /* Status Section */
        .status-section {
            padding: 48px;
            margin-top: -32px;
            position: relative;
            z-index: 10;
        }

        .status-card {
            background: var(--panel-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .status-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .status-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 14px;
        }

        /* Práticas Grid */
        .practices-section {
            padding: 0 48px 64px;
        }

        .practices-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .practices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (min-width: 640px) {
            .practices-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .practices-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .practice-card {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, z-index 0.2s;
        }

        .practice-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .practice-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .practice-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .practice-card:hover .practice-overlay {
            opacity: 1;
        }

        .practice-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px;
            transform: translateY(4px);
            transition: transform 0.2s;
        }

        .practice-card:hover .practice-content {
            transform: translateY(0);
        }

        .practice-tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--green);
            background: rgba(0,0,0,0.6);
            padding: 4px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .practice-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 4px;
            line-height: 1.3;
        }

        /* Grid Cards Original */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
            margin: 32px 0;
        }

        .module-img {
            width: 100%;
            aspect-ratio: 16/9;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
        }

        .module-title {
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .module-card {
            background: var(--panel-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        /* Logout Button */
        .logout-section {
            margin-top: 48px;
            display: flex;
            justify-content: center;
            padding-bottom: 64px;
        }

        .btn-logout {
            border: 1px solid rgba(107, 114, 128, 0.6);
            color: var(--text-muted);
            background: transparent;
            padding: 10px 32px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 24px;
                gap: 16px;
            }

            .nav {
                display: none;
            }

            .hero-content {
                left: 24px;
                right: 24px;
                bottom: 48px;
            }

            .hero-title {
                font-size: 32px;
            }

            .status-section,
            .practices-section {
                padding: 24px;
            }

            .practices-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header" id="mainHeader">
        <div class="logo">IFCE<span>Lab</span></div>
        <nav class="nav">
            <a href="#" class="active">Início</a>
            <a href="#">Práticas</a>
            <a href="#">Avaliações</a>
            <a href="#">Relatórios</a>
        </nav>
        <div class="user-info">
            <span style="font-size: 14px; color: var(--text-muted);">Professor</span>
            <div class="user-badge">P</div>
        </div>
    </header>

    <div class="hero">
        <img src="baner_p.jpeg" alt="Laboratório de eletrônica">
        <div class="hero-overlay"></div>
        <div class="hero-overlay-bottom"></div>
        <div class="hero-content">
            <p class="hero-subtitle">Sistema de Laboratório · IFCE</p>
            <h1 class="hero-title">Painel de<br>Avaliação</h1>
            <p class="hero-description">Gerencie práticas, acompanhe o progresso dos alunos e avalie trabalhos em tempo real.</p>
            <div class="hero-buttons">
                <button class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    Mais informações
                </button>
            </div>
        </div>
    </div>

    <div class="status-section">
        <div class="status-card">
            <h2 class="status-header">📡 Status das Bancadas</h2>
            <div id="listaStatusGrupos" class="status-list">
                Aguardando dados...
            </div>
        </div>
    </div>

    <div class="practices-section">
        <h2 class="practices-title">Práticas Disponíveis</h2>
        <div class="grid-cards" id="gridProf"></div>
    </div>

    <div class="logout-section">
        <button onclick="sairConta()" class="btn-logout">Encerrar Sessão</button>
    </div>

    <script>
        // Header scroll effect
        window.addEventListener('scroll', function() {
            const header = document.getElementById('mainHeader');
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
