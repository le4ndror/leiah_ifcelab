<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Professor - IFCE LAB</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="system-active">
<div class="container">
    <div class="card">
        <button id="btnVoltarTopo" class="btn-voltar-topo" onclick="window.location.href='index.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar
        </button>
        <div id="menuProfessor" class="tela ativa">
            <h1>Painel de Avaliação (Professor)</h1>
            <div style="background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 25px;">
                <h2 style="margin-bottom: 15px; color: var(--text-main); border-bottom: 1px solid #ccc; padding-bottom: 5px;">📡 Status das Bancadas</h2>
                <div id="listaStatusGrupos" style="max-height: 200px; overflow-y: auto; font-size: 0.95rem;">
                    Aguardando dados...
                </div>
            </div>
            <div class="grid-cards" id="gridProf"></div>
            <hr>
            <button onclick="sairConta()" class="btn-voltar" style="max-width: 300px; margin: 0 auto; display: block;">Encerrar Sessão</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
